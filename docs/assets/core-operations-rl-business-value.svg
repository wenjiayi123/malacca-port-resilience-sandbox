    <g transform="translate(946 296)"><rect width="212" height="108" rx="15" fill="#0a2438" stroke="#42e6ad"/><text x="18" y="28" fill="#83aabd" font-size="12">硬约束违规</text><text x="18" y="65" fill="#53eeb2" font-size="28" font-weight="700">0</text><text x="18" y="88" fill="#a5c0cf" font-size="11">10/10 域实际参与</text></g>
