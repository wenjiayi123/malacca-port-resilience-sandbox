  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020b1d"/>
      <stop offset="0.52" stop-color="#06274a"/>
      <stop offset="1" stop-color="#031225"/>
    </linearGradient>
