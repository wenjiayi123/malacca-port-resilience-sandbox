name: Feature request
description: Propose an evidence-driven, reproducible improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Data, algorithm, safety and compatibility impact
      description: Explain provenance, split isolation, failure boundaries and user-visible evidence.
    validations:
      required: true
