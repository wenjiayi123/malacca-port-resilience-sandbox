name: release-artifact

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm release:check
      - name: Build portable reference artifact
        run: |
          mkdir -p release
          tar -czf "release/malacca-port-resilience-sandbox-${GITHUB_REF_NAME}.tgz" dist server shared data reports scripts/rl docs package.json pnpm-lock.yaml README.md LICENSE NOTICE SECURITY.md
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release/malacca-port-resilience-sandbox-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - name: Attest release provenance after publication
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release/malacca-port-resilience-sandbox-${{ github.ref_name }}.tgz
      - name: Attest release SBOM after publication
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release/malacca-port-resilience-sandbox-${{ github.ref_name }}.tgz
          sbom-path: release/malacca-port-resilience-sandbox-${{ github.ref_name }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: malacca-port-resilience-sandbox-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
